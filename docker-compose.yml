# Run the server locally in one command: `docker compose up`.
# A small stand-in for the managed cluster - the same image, just one instance.
# Redis and PostgreSQL join here in the next steps of the scale plan.
services:
  server:
    build: .
    ports:
      - "8765:8765"          # host 8765 -> container 8765, so a host client connects
    environment:
      KF_SERVER_HOST: "0.0.0.0"   # bind every interface so the port mapping is reachable
      KF_SERVER_PORT: "8765"
