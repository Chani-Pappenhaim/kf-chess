# Run the server locally in one command: `docker compose up`.
# A small stand-in for the managed cluster - the same image, plus the Redis,
# PostgreSQL (two shards), and Kafka it uses once the server runs as more
# than one instance.
#
# The client-facing port (8765) belongs to ws-gateway, not to `server`
# directly - `server`'s own 8765 is internal-only (no host port mapping), so
# a local `docker compose up` actually exercises the same WebSocket Gateway
# hop (rate limiting, TLS termination) production/k8s does, instead of a
# host client quietly connecting straight past it. The default `SERVER_URL`
# (ws://localhost:8765) still works unchanged for a client - only what is
# listening on the other end of it moved.
#
# TLS (wss://) is opt-in, off here by default - turning it on needs a cert
# first (`python scripts/generate_dev_cert.py`, writes ./certs/), which isn't
# something `docker compose up` can generate for you unattended. To enable
# it: uncomment the two KF_TLS_* lines on `ws-gateway` and `server` below and
# add `volumes: ["./certs:/app/certs:ro"]` to both.
services:
  server:
    build: .
    ports:
      - "8766:8766"          # the API Gateway's login endpoint (still direct)
    environment:
      KF_SERVER_ID: "local"       # must match the key ws-gateway's KF_GAME_SERVERS uses below
      KF_SERVER_HOST: "0.0.0.0"   # bind every interface so ws-gateway can reach it
      KF_SERVER_PORT: "8765"
      KF_API_HOST: "0.0.0.0"
      KF_API_PORT: "8766"
      # KF_TLS_CERT_FILE: "/app/certs/dev-cert.pem"
      # KF_TLS_KEY_FILE: "/app/certs/dev-key.pem"
      # Without this, redis/postgres/kafka below sit unused: DISTRIBUTED is
      # what actually switches server/__main__.py from its in-memory
      # fallbacks to them.
      KF_DISTRIBUTED: "1"
      KF_REDIS_URL: "redis://redis:6379"   # reach the redis service below by name
      # KF_DATABASE_URL (singular) is match history's one store - history
      # isn't sharded, so it lives on shard-0 same as any other unsharded
      # table would. KF_DATABASE_URLS (plural) is what actually shards
      # accounts (accounts/sharded_store.py), by hash(username) across both.
      KF_DATABASE_URL: "postgresql://kfchess:kfchess@postgres-shard-0:5432/kfchess"
      KF_DATABASE_URLS: "postgresql://kfchess:kfchess@postgres-shard-0:5432/kfchess,postgresql://kfchess:kfchess@postgres-shard-1:5432/kfchess"
      KF_KAFKA_URL: "kafka:9092"
      # The computer opponent asks Gemini for its moves when this is set (put
      # GEMINI_API_KEY=... in a .env file beside this one, never in git);
      # left empty, it plays greedily on its own.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      - redis
      - postgres-shard-0
      - postgres-shard-1
      - kafka

  ws-gateway:
    build: .
    command: ["python", "-m", "server.ws_gateway"]
    ports:
      - "8765:8760"          # host 8765 -> gateway's own 8760, so SERVER_URL's default is unchanged
    environment:
      KF_GATEWAY_HOST: "0.0.0.0"
      KF_GATEWAY_PORT: "8760"
      KF_GAME_SERVERS: "local=ws://server:8765"   # the `server` service, by its docker-network name
      # KF_TLS_CERT_FILE: "/app/certs/dev-cert.pem"
      # KF_TLS_KEY_FILE: "/app/certs/dev-key.pem"
    depends_on:
      - server

  results-worker:
    build: .
    command: ["python", "-m", "server.results_worker"]
    environment:
      KF_DISTRIBUTED: "1"
      KF_DATABASE_URL: "postgresql://kfchess:kfchess@postgres-shard-0:5432/kfchess"
      KF_DATABASE_URLS: "postgresql://kfchess:kfchess@postgres-shard-0:5432/kfchess,postgresql://kfchess:kfchess@postgres-shard-1:5432/kfchess"
      KF_KAFKA_URL: "kafka:9092"
    depends_on:
      - postgres-shard-0
      - postgres-shard-1
      - kafka

  redis:
    image: redis:7-alpine        # shared state: room directory, matchmaking queue
    ports:
      - "6379:6379"

  postgres-shard-0:
    image: postgres:16-alpine    # accounts (half, by hash(username)) + match history
    environment:
      POSTGRES_USER: "kfchess"
      POSTGRES_PASSWORD: "kfchess"
      POSTGRES_DB: "kfchess"
    ports:
      # Host port 5434, not the default 5432 - a local PostgreSQL install
      # (common on a dev machine) is often already listening on 5432, which
      # this would otherwise conflict with. Only the host-facing side moved;
      # every other container still reaches this one at the container's own
      # 5432 over the internal docker network (postgres-shard-0:5432).
      - "5434:5432"

  postgres-shard-1:
    image: postgres:16-alpine    # accounts (the other half)
    environment:
      POSTGRES_USER: "kfchess"
      POSTGRES_PASSWORD: "kfchess"
      POSTGRES_DB: "kfchess"
    ports:
      - "5433:5432"

  kafka:
    # The official Apache Kafka image (not Bitnami's - Bitnami stopped
    # publishing free-tier version-pinned tags like 3.7 in 2025, only
    # `latest`/paid-subscription tags remain, which broke this compose file).
    image: apache/kafka:3.7.0     # durable queue: finished-game results (server/results_queue.py)
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
    ports:
      - "9092:9092"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # a school-project dashboard, not a secured deployment
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"          # http://localhost:3000 - the "Active Rooms" dashboard is pre-loaded
    depends_on:
      - prometheus
