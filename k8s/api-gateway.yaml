# API Gateway: stateless HTTP (login, health, metrics). Scales freely on CPU
# like any ordinary web service - it holds nothing between requests.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8766
      targetPort: 8766
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: kfchess-server:latest
          command: ["python", "-m", "server"]  # the API Gateway starts inside run()
          ports:
            - containerPort: 8766
          envFrom:
            - configMapRef:
                name: kfchess-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
