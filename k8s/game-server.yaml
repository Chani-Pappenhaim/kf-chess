# Game Server shards: stateful, short-lived, one live board per room. A
# StatefulSet (not a Deployment) because Consistent Hashing needs each shard
# individually addressable by a stable name - game-server-0, game-server-1 -
# which only a StatefulSet + headless Service provide.
apiVersion: v1
kind: Service
metadata:
  name: game-server
spec:
  clusterIP: None  # headless: DNS resolves straight to each pod, not one VIP
  selector:
    app: game-server
  ports:
    - name: game
      port: 8765
    - name: api
      port: 8766
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: game-server
spec:
  serviceName: game-server
  replicas: 2  # must match the pool listed in KF_GAME_SERVERS
  selector:
    matchLabels:
      app: game-server
  template:
    metadata:
      labels:
        app: game-server
    spec:
      containers:
        - name: game-server
          image: kfchess-server:latest
          command: ["python", "-m", "server"]
          ports:
            - containerPort: 8765
            - containerPort: 8766
          envFrom:
            - configMapRef:
                name: kfchess-config
          env:
            - name: KF_SERVER_ID  # the pod's own stable name, e.g. game-server-0
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
# Autoscale on active_rooms (from /metrics), not CPU - a game server is I/O
# and connection-bound, not CPU-bound. The `Pods` metric type requires a
# custom-metrics API in the cluster (e.g. Prometheus + prometheus-adapter
# scraping /metrics) - this HPA alone is not enough without that piece wired
# up; it says what to scale on, not how the metric gets there.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: game-server
  minReplicas: 2
  maxReplicas: 100
  metrics:
    - type: Pods
      pods:
        metric:
          name: active_rooms
        target:
          type: AverageValue
          averageValue: "4000"  # rooms per shard before adding another
