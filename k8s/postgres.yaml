# PostgreSQL: accounts (sharded by hash(username), accounts/sharded_store.py)
# and match history (unsharded, lives on shard 0). Two replicas over a
# headless Service - the same shape as game-server.yaml's shards, since a
# StatefulSet + headless Service is what gives each replica a stable,
# individually-addressable name (postgres-0, postgres-1) instead of one VIP
# load-balancing across interchangeable pods, which sharded data can never be.
# The migration path to a distributed SQL engine (CockroachDB/Spanner) at the
# far edge of scale is a config change from here, not a rewrite - see
# Server_Design.md.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: kfchess
  POSTGRES_PASSWORD: kfchess
  POSTGRES_DB: kfchess
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None  # headless: DNS resolves straight to each pod, not one VIP
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 2  # must match the shard count in KF_DATABASE_URLS (kfchess-config)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
